name: Daily Value Bet Finder

# GitHub Actions cron schedules run in UTC, and this repo's config also
# treats everything as UTC, so no timezone conversion is needed anywhere.
#
# NOTE: GitHub's scheduler is best-effort and can be delayed by minutes
# during ordinary peak load. If you're seeing delays measured in HOURS
# rather than minutes, that's a different (and more serious) reliability
# problem -- see fallback_checker.yml and README.md "Delivery reliability"
# for the mitigation.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
    inputs:
      dry_run:
        description: "Run everything but skip sending the email"
        type: boolean
        default: false

# Needed so the job can commit the updated history.db back to the repo.
permissions:
  contents: write

# Prevent two runs overlapping (e.g. a manual trigger firing while the
# scheduled run is still in progress) from racing to commit history.db.
concurrency:
  group: value-bet-finder-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure we're on the latest commit before running
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - name: Run daily value bet analysis
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # || falls back to a safe default if the ODDS_REGIONS secret is
          # unset. IMPORTANT: without the `|| 'eu,uk'` fallback, an unset
          # secret still sets this env var to an EMPTY STRING (not "unset"),
          # which the Odds API rejects outright with INVALID_REGION -- this
          # bit us on 2026-08-29 without the fallback in place.
          ODDS_REGIONS: ${{ secrets.ODDS_REGIONS || 'eu,uk' }}
          DATABASE_PATH: ${{ github.workspace }}/history.db
          LOG_PATH: ${{ github.workspace }}/finder.log
          LOG_LEVEL: INFO
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py

      - name: Upload log as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finder-log-${{ github.run_number }}
          path: finder.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Persist history.db back to the repository
        if: always()
        run: |
          set -e
          git config user.name "value-bet-finder-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ ! -f history.db ]; then
            echo "No history.db produced this run - nothing to persist."
            exit 0
          fi

          # We deliberately never `git merge` / `git rebase` history.db --
          # those reconcile divergent binary blobs line-by-line, which
          # always conflicts. Instead: reset to latest remote, drop our
          # freshly generated DB on top as a single new commit, retry on
          # push rejection (another run raced us) by repeating the whole
          # reset+recommit cycle.
          cp history.db /tmp/history.db.new

          attempt=1
          max_attempts=5
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Push attempt $attempt/$max_attempts"

            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cp /tmp/history.db.new history.db

            git add history.db
            if git diff --cached --quiet; then
              echo "No changes to history.db relative to latest remote - nothing to commit."
              exit 0
            fi

            git commit -m "chore: update history.db from run #${{ github.run_number }}"

            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed successfully."
              exit 0
            fi

            echo "Push rejected (likely a concurrent run) - retrying after a short backoff..."
            attempt=$((attempt + 1))
            sleep $(( (RANDOM % 10) + 5 ))
          done

          echo "Failed to push history.db after $max_attempts attempts." >&2
          exit 1
